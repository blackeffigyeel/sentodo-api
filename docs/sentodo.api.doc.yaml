              - name
              - allowedIps
            example:
              name: Production
              allowedIps:
              - 41.58.1.9
              - 102.89.0.4
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apiKey:
                        $ref: '#/components/schemas/ApiKey'
                      key:
                        type: string
                        example: sk_live_9f2c…
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api-keys/{id}/allowlist:
    patch:
      tags:
      - API Keys
      summary: Replace the IP allowlist
      description: Corporate profiles only. Keys are managed with a **signed-in session (bearer token)**, never with an API
        key.
      operationId: updateAllowlist
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowedIps:
                  type: array
                  items:
                    type: string
              required:
              - allowedIps
            example:
              allowedIps:
              - 102.89.0.4
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apiKey:
                        $ref: '#/components/schemas/ApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api-keys/{id}:
    delete:
      tags:
      - API Keys
      summary: Revoke an API key
      description: Corporate profiles only. Keys are managed with a **signed-in session (bearer token)**, never with an API
        key. Revocation is permanent.
      operationId: revokeApiKey
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      apiKey:
                        $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /command-centre/states:
    get:
      tags:
      - Command Centre
      summary: Get every feature and provider state
      description: 'The App Command Centre decides whether each feature and provider may run. Every service consults it before
        working. Switch-offs return **503** with the feature or provider in `data`. `platform` is a master switch. Available
        to any authorised client: service token, bearer token or API key.'
      operationId: getStates
      security:
      - serviceToken: []
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: States
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CommandCentreSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /command-centre/states/{key}:
    patch:
      tags:
      - Command Centre
      summary: Switch a feature or provider on or off
      description: Internal operators only (service token). Use a feature key such as `bills.tv` or a provider identifier
        such as `mock-tv-dstv`. A `reason` is shown to clients while something is off. Every change is audit-logged.
      operationId: setState
      security:
      - serviceToken: []
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
          example: bills.tv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
                reason:
                  type: string
                  maxLength: 200
              required:
              - enabled
            example:
              enabled: false
              reason: Provider maintenance
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      key:
                        type: string
                      enabled:
                        type: boolean
                      reason:
                        type: string
                        nullable: true
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token from `POST /auth/login`.
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Corporate API key (`sk_live_…`). Only usable from allowlisted IP addresses.
    serviceToken:
      type: apiKey
      in: header
      name: x-service-token
      description: Internal service token for operators and trusted services.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Unique value (8-64 chars: letters, digits, `-`, `_`) per logical request. Retrying with the same key returns
        the original transaction instead of charging twice. Strongly recommended for every money-moving call.'
      schema:
        type: string
        pattern: ^[\w-]{8,64}$
        example: order-2026-11-05-0001
  responses:
    BadRequest:
      description: Validation failed or the request is invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Validation failed
            data:
              issues:
              - path: amount
                message: Must be an integer number of kobo
    Unauthorised:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Authentication is required
            data: null
    Forbidden:
      description: Not permitted (unverified identity, wrong profile type, IP not allowlisted)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Verify your identity before making transactions
            data: null
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Resource not found
            data: null
    Conflict:
      description: Conflicts with existing data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: A profile with this email or phone number already exists
            data: null
    Unprocessable:
      description: Well-formed but cannot be processed, e.g. insufficient funds
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Insufficient funds
            data:
              balance: 100000
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Too many requests. Please slow down.
            data:
              retryAfterSeconds: 2
    Unavailable:
      description: Switched off by the command centre, or a dependency is down
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: This service is temporarily unavailable
            data:
              feature: bills.airtime
              reason: Aggregator outage
  schemas:
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        data:
          nullable: true
          example: null
    KoboAmount:
      type: integer
      minimum: 1
      description: '**Integer kobo** (1 NGN = 100 kobo). 250000 means ₦2,500.00. Decimals and strings are rejected.'
      example: 250000
    Money:
      type: object
      properties:
        kobo:
          type: integer
          example: 250000
        display:
          type: string
          example: ₦2,500.00
          description: For display only. Never parse this value.
      required:
      - kobo
      - display
    ProfileType:
      type: string
      enum:
      - INDIVIDUAL
      - CORPORATE
    TransactionType:
      type: string
      enum:
      - P2P_TRANSFER
      - EXTERNAL_TRANSFER
      - AIRTIME
      - DATA
      - ELECTRICITY
      - EDUCATION
      - TV
      - FOOD
      - FUNDING
    TransactionStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - SUCCESS
      - FAILED
    RegisterRequest:
      type: object
      required:
      - type
      - email
      - phone
      - password
      properties:
        type:
          $ref: '#/components/schemas/ProfileType'
        email:
          type: string
          format: email
        phone:
          type: string
          example: 08031234567
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least one letter and one digit
        firstName:
          type: string
        lastName:
          type: string
        businessName:
          type: string
          description: Corporate profiles
    VerifyEmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - email
      - code
    VerifyPhoneRequest:
      type: object
      properties:
        phone:
          type: string
        code:
          type: string
          pattern: ^\d{6}$
      required:
      - phone
      - code
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ProfileType'
        email:
          type: string
        phone:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        businessName:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        identityVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
          pattern: ^\d{10}$
          example: 0123456789
        name:
          type: string
        currency:
          type: string
          example: NGN
        balance:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - ACTIVE
          - FROZEN
          - CLOSED
        createdAt:
          type: string
          format: date-time
    Bank:
      type: object
      properties:
        code:
          type: string
          example: 058
        name:
          type: string
          example: Guaranty Trust Bank
    TransferRequest:
      type: object
      required:
      - fromAccountId
      - bankCode
      - accountNumber
      - amount
      properties:
        fromAccountId:
          type: string
          format: uuid
        bankCode:
          type: string
          description: '`090` for Sentodo (p2p)'
        accountNumber:
          type: string
          pattern: ^\d{10}$
        amount:
          $ref: '#/components/schemas/KoboAmount'
        narration:
          type: string
          maxLength: 100
      description: Minimum ₦1.00, maximum ₦5,000,000.00 per transfer.
    TransferQuote:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          type: object
          properties:
            waived:
              type: boolean
            base:
              $ref: '#/components/schemas/Money'
            surcharge:
              $ref: '#/components/schemas/Money'
            vat:
              $ref: '#/components/schemas/Money'
            total:
              $ref: '#/components/schemas/Money'
        totalDebit:
          $ref: '#/components/schemas/Money'
        freeTransfersRemaining:
          type: integer
        recipient:
          type: object
          properties:
            accountName:
              type: string
            bankName:
              type: string
            isSentodo:
              type: boolean
    BillQuote:
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        totalDebit:
          $ref: '#/components/schemas/Money'
        narration:
          type: string
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: SNT-LZ3K9A1B-4F2A9C1B
        type:
          $ref: '#/components/schemas/TransactionType'
        status:
          $ref: '#/components/schemas/TransactionStatus'
        accountId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        discount:
          $ref: '#/components/schemas/Money'
        totalDebit:
          type: object
          properties:
            kobo:
              type: integer
            display:
              type: string
            description: amount + fee - discount
        feeWaived:
          type: boolean
        counterparty:
          nullable: true
          type: object
          properties:
            name:
              type: string
            bank:
              type: string
              nullable: true
        provider:
          type: string
          nullable: true
        providerReference:
          type: string
          nullable: true
        narration:
          type: string
          nullable: true
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Only when `SUCCESS`. Includes `token` for electricity, education and food.
        failureReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          example: sk_live_9f2c
        allowedIps:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
          nullable: true
    StateView:
      type: object
      properties:
        key:
          type: string
          example: bills.tv
        kind:
          type: string
          enum:
          - FEATURE
          - PROVIDER
        enabled:
          type: boolean
        reason:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
    CommandCentreSnapshot:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        features:
          type: array
          items:
            $ref: '#/components/schemas/StateView'
        providers:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/StateView'
            - type: object
              properties:
                name:
                  type: string
                  example: DSTV (mock)
                category:
                  type: string
                  example: TV
