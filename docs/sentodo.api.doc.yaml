# Sentodo MFB API (OpenAPI 3.0). Served at /docs (Swagger UI) and /docs/openapi.json.
openapi: 3.0.3
info:
  title: Sentodo MFB API
  version: 1.0.0
  description: 'Sentodo Microfinance Bank (Sentodo MFB) API: buy airtime, data, electricity, education pins, TV subscriptions
    and food, and send money (p2p and to other banks).


    ## Conventions


    **Response envelope.** Every response, success or failure, has the same shape:


    ```json

    { "success": true, "message": "Account retrieved", "data": { } }

    ```


    On failure `success` is `false` and `data` is `null` or carries safe context (for example validation `issues`).


    **Money is integer kobo.** All amounts are integers in kobo (1 NGN = 100 kobo): `250000` is ₦2,500.00. Responses return
    `{ "kobo": 250000, "display": "₦2,500.00" }`; `display` is for people only.


    **Profiles and accounts.** A user is a *profile* (individual or corporate). A profile can hold several 10-digit *accounts*.
    Individual and corporate profiles both receive discounts on bill payments (1% and 2.5%).


    **Asynchronous money movement.** Transfers and bill payments return **202** with `PROCESSING` after debiting the account;
    a background queue completes them. Poll `GET /transactions/{id}`. Failures are refunded automatically.


    **Idempotency.** Send `Idempotency-Key` on every transfer and purchase.


    **Nigerian formats.** Phone numbers: 11 digits (`+234` accepted). Account numbers: 10 digits. DStv/GOtv IUC numbers: 10
    digits.


    ## Authentication


    * **Bearer token** (`POST /auth/login`) for people using apps.

    * **API key** (`x-api-key`) for corporate integrations. Keys only work from allowlisted IP addresses. See the Corporate
    API guide.


    ## Rate limiting


    Limits are per client (profile or API key when authenticated, otherwise IP) and per policy: `global`, `auth`, `standard`,
    `transactions`, `identity`. Costlier endpoints use more of the allowance. Responses include `X-RateLimit-Limit` and `X-RateLimit-Remaining`;
    `429` adds `Retry-After`.


    ## Provider simulation


    All providers are mocks. Deterministic triggers: a customer number or account number ending in `0000` is declined (and
    refunded); an account number ending in `9999` cannot be resolved. Test BVNs are listed under *Verify identity*; any of
    the configured 6-digit codes verifies a phone.'
  contact:
    name: Sentodo Microfinance Bank
servers:
- url: /api/v1
  description: This server
tags:
- name: Auth
- name: Profiles
- name: Accounts
- name: Banks
- name: Transfers
- name: Transactions
- name: Bills
- name: API Keys
- name: Command Centre
- name: System
paths:
  /health:
    get:
      tags:
      - System
      summary: Liveness probe
      description: Returns 200 while the process is running.
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      uptimeSeconds:
                        type: integer
  /health/ready:
    get:
      tags:
      - System
      summary: Readiness probe
      description: Checks PostgreSQL, MongoDB and Redis. Returns 503 if any dependency is down.
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      checks:
                        type: object
                        additionalProperties:
                          type: boolean
                        example:
                          postgresql: true
                          mongodb: true
                          redis: true
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register a profile
      description: Creates an **unverified** profile and emails a 6-digit verification code (sent through a queue). A *profile*
        is a user; once email and phone are verified, the first 10-digit account is created automatically. Individuals need
        `firstName` and `lastName`; corporates need `businessName`. Phone numbers are 11-digit Nigerian mobiles (`+234` and
        `234` forms are normalised).
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              type: INDIVIDUAL
              email: adaeze@example.com
              phone: 08031234567
              password: Password123
              firstName: Adaeze
              lastName: Okonkwo
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/verify-email:
    post:
      tags:
      - Auth
      summary: Verify email address
      description: Verifies the emailed code. After five wrong attempts the code is locked; request a new one.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              email: adaeze@example.com
              code: '482913'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-phone:
    post:
      tags:
      - Auth
      summary: Verify phone number
      description: No SMS is sent. Any code from the configured list of 6-digit codes (`MOCK_PHONE_CODES`, default `123456`,
        `654321`, `246810`, `135790`) verifies the number.
      operationId: verifyPhone
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneRequest'
            example:
              phone: 08031234567
              code: '123456'
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/resend-email-code:
    post:
      tags:
      - Auth
      summary: Resend the email code
      description: Always answers 200 so it cannot be used to discover which emails are registered.
      operationId: resendEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      responses:
        '200':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    nullable: true
                    example: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in
      description: Returns a bearer token. Email and phone must both be verified.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: adaeze@example.com
              password: Password123
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      tokenType:
                        type: string
                        example: Bearer
                      expiresInSeconds:
                        type: integer
                        example: 3600
                      profile:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/verify-token:
    post:
      tags:
      - Auth
      summary: Verify an access token
      description: Confirms that a token is genuine, unexpired and that its profile is still active. Useful for services that
        receive Sentodo tokens.
      operationId: verifyToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
              - token
      responses:
        '200':
          description: Valid
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        example: true
                      profileId:
                        type: string
                        format: uuid
                      profileType:
                        $ref: '#/components/schemas/ProfileType'
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /profiles/me:
    get:
      tags:
      - Profiles
      summary: Get my profile
      description: Rate limited (see **Rate limiting**).
      operationId: getMyProfile
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/Profile'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /profiles/me/identity:
    post:
      tags:
      - Profiles
      summary: Verify identity (BVN)
      description: 'Verifies the profile against the BVN registry (mock). Individuals must match the registered name. One
        BVN can back one profile. **Identity verification is required before any money can leave an account.** Each lookup
        has a cost recorded for reporting. Test BVNs: `22222222221` (Adaeze Okonkwo), `22222222222` (Tunde Bakare), `22222222223`
        (Fatima Bello), `22222222224` (Chinedu Eze), `22222222225` (Ngozi Adeyemi).'
      operationId: verifyIdentity
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bvn:
                  type: string
                  pattern: ^\d{11}$
                  example: '22222222221'
              required:
              - bvn
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      profile:
                        $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /accounts:
    get:
      tags:
      - Accounts
      summary: List my accounts
      operationId: listAccounts
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accounts:
                        type: array
                        items:
                          $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
      - Accounts
      summary: Open another account
      description: A profile can hold up to 5 accounts, each with its own 10-digit number.
      operationId: createAccount
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 80
                  example: Savings
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /accounts/{id}:
    get:
      tags:
      - Accounts
      summary: Get an account
      description: Accounts that belong to other profiles are reported as 404.
      operationId: getAccount
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /accounts/{id}/fund:
    post:
      tags:
      - Accounts
      summary: Fund an account (sandbox)
      description: 'Credits test money. **Disabled by default**: an operator must switch on `sandbox-funding` in the command
        centre. Amount is integer kobo, at most ₦1,000,000.'
      operationId: fundAccount
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Resource id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  $ref: '#/components/schemas/KoboAmount'
              required:
              - amount
            example:
              amount: 5000000
      responses:
        '200':
          description: Funded
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      account:
                        $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /banks:
    get:
      tags:
      - Banks
      summary: List banks
      description: Nigerian banks with CBN codes, including Sentodo MFB (`090`).
      operationId: listBanks
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      responses:
        '200':
          description: Banks
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      banks:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bank'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /banks/resolve:
    get:
      tags:
      - Banks
      summary: Resolve an account name (name enquiry)
      description: 'Sentodo accounts are resolved locally and flagged `isSentodo: true` (such transfers are p2p). Other banks
        are resolved through the transfer provider.'
      operationId: resolveAccount
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: bankCode
        in: query
        required: true
        schema:
          type: string
          example: 058
      - name: accountNumber
        in: query
        required: true
        schema:
          type: string
          pattern: ^\d{10}$
          example: 0123456789
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      accountNumber:
                        type: string
                      accountName:
                        type: string
                        example: OLUWASEUN ADEBAYO
                      bankCode:
                        type: string
                      bankName:
                        type: string
                      isSentodo:
                        type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /transfers/quote:
    post:
      tags:
      - Transfers
      summary: Quote a transfer
      description: 'Resolves the recipient and prices the transfer without moving money. Fees: free for the first **20** (individual)
        or **10** (corporate) transfers each calendar month (Lagos time); afterwards ₦10 + 7.5% VAT, plus ₦50 (before VAT)
        above ₦10,000.'
      operationId: quoteTransfer
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              fromAccountId: 7b1f6c0e-5a52-4f0e-9d0b-0c3f7f1a1a11
              bankCode: 090
              accountNumber: 0123456789
              amount: 250000
              narration: Rent share
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/TransferQuote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /transfers:
    post:
      tags:
      - Transfers
      summary: Send money
      description: Debits the sender immediately and returns **202** with status `PROCESSING`. The recipient is credited (or
        the other bank called) by a background queue. Poll `GET /transactions/{id}` for `SUCCESS` or `FAILED`; failures are
        refunded automatically. A Sentodo recipient (`bankCode` `090`) makes this a p2p transfer. Send an `Idempotency-Key`
        so retries never double-charge. **Requires identity verification.**
      operationId: createTransfer
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            example:
              fromAccountId: 7b1f6c0e-5a52-4f0e-9d0b-0c3f7f1a1a11
              bankCode: 090
              accountNumber: 0123456789
              amount: 250000
              narration: Rent share
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /transactions:
    get:
      tags:
      - Transactions
      summary: List transactions
      description: Newest first. Use `nextCursor` as `before` for the next page.
      operationId: listTransactions
      security:
      - bearerAuth: []
      - apiKeyAuth: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before
        in: query
        schema:
          type: string
          format: date-time
      - name: accountId
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/TransactionType'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/TransactionStatus'
      responses:
        '200':
          description: Transactions
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - message
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      transactions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Transaction'
                      nextCursor:
                        type: string
                        format: date-time
                        nullable: true
        '400':
